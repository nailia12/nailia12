<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 84" width="900" height="84" role="img" aria-labelledby="t d">
  <title id="t">Yang saya kerjakan</title>
  <desc id="d">Kalimat bergantian: menerjemahkan kebutuhan bisnis menjadi sistem, merancang UI/UX, membangun web dengan Laravel, Livewire, dan Vue, membuat aplikasi mobile dengan Flutter, dan memakai AI untuk bekerja lebih cepat.</desc>

  <style>
    .l {
      font-family: "JetBrains Mono", "Fira Code", Consolas, "SFMono-Regular", Menlo, monospace;
      font-size: 20px; fill: #EAF1FF; text-anchor: middle; opacity: 0;
      animation: cycle 15s infinite;
    }
    .p { fill: #13B9FD; }
    .a2 { animation-delay: 3s; }
    .a3 { animation-delay: 6s; }
    .a4 { animation-delay: 9s; }
    .a5 { animation-delay: 12s; }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(10px); }
      3%   { opacity: 1; transform: translateY(0); }
      17%  { opacity: 1; transform: translateY(0); }
      20%  { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .l { animation: none; opacity: 0; }
      .a1 { opacity: 1; }
    }
  </style>

  <rect x="1" y="1" width="898" height="82" rx="16" fill="#0A1128" stroke="#22346F" stroke-width="2"/>
  <circle cx="32" cy="42" r="6" fill="#FF6B5B"/>
  <circle cx="54" cy="42" r="6" fill="#F5B544"/>
  <circle cx="76" cy="42" r="6" fill="#42B883"/>

  <text class="l a1" x="490" y="49"><tspan class="p">&gt; </tspan>Menerjemahkan kebutuhan bisnis menjadi sistem yang jelas</text>
  <text class="l a2" x="490" y="49"><tspan class="p">&gt; </tspan>Merancang UI/UX yang mudah dipakai dan enak dilihat</text>
  <text class="l a3" x="490" y="49"><tspan class="p">&gt; </tspan>Membangun web dengan Laravel, Livewire, dan Vue</text>
  <text class="l a4" x="490" y="49"><tspan class="p">&gt; </tspan>Membuat aplikasi mobile dengan Flutter</text>
  <text class="l a5" x="490" y="49"><tspan class="p">&gt; </tspan>Memakai AI untuk bekerja lebih cepat dan terarah</text>
</svg>
